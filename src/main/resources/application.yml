spring:
  application:
    name: autoInvest

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:auto-invest}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer


  r2dbc:
    url: r2dbc:mysql://localhost:3306/autoInvest
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  sql:
    init:
      mode: embedded
      platform: mysql



  profiles:
    active: redis


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

logging:
  level:
    io.r2dbc.spi: DEBUG
    org.springframework.data.r2dbc: DEBUG
    dev.miku.r2dbc.mysql: DEBUG
    org.springframework.data.r2dbc.core: DEBUG

    com.jypLord.domain: DEBUG
    com.jypLord.api: DEBUG
#    org.springframework.web.reactive.socket: debug
#    org.springframework.web.reactive.socket.client: debug
#    org.springframework.web.reactive.socket.client.ReactorNettyWebSocketClient: debug

#    reactor.netty: DEBUG
#    reactor.netty.http.client: DEBUG
#    reactor.netty.transport: TRACE

    reactor.netty.http.client.HttpClient: DEBUG

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

management:
  metrics:
    export:
      cloudwatch:
        enabled: ${CLOUDWATCH_METRICS_ENABLED:true}
        namespace: ${CLOUDWATCH_NAMESPACE:autoInvest}
        step: ${CLOUDWATCH_STEP:1m}

